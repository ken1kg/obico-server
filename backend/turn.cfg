[turn]
# --- Configuration Options ---
# Uncomment and fill the lines you need.

# 1. Server Address & Port
# If commented out, it should use the default Obico settings.
# server = turn.obico.io
# port = 80

# 2. Authentication Method (Choose A or B)

# Option A: REST API (Auth Secret) - Recommended for Coturn/eturnal
# This generates time-limited credentials automatically.
# secret = YOUR_HEX_SECRET_HERE
# username = obico   <-- Optional base username

# Option B: Static Credentials (Long-Term Credential)
# username = yourturnusername
# password = yourturnpassword
